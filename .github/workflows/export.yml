name: "自动打包发布"

on:
  push:
    tags:
      - "v*"

permissions:
  contents: write

jobs:
  export_game:
    runs-on: ubuntu-latest
    name: 导出并发布游戏

    steps:
      - name: 检出代码
        uses: actions/checkout@v4
        with:
          lfs: true

      - name: 修复虚拟机的写入权限
        run: chmod -R 777 .

      - name: Godot 导出
        uses: firebelley/godot-export@v5.2.1
        with:
          godot_executable_download_url: https://github.com/godotengine/godot/releases/download/4.4.1-stable/Godot_v4.4.1-stable_linux.x86_64.zip
          godot_export_templates_download_url: https://github.com/godotengine/godot/releases/download/4.4.1-stable/Godot_v4.4.1-stable_export_templates.tpz
          relative_project_path: ./
          use_preset_export_path: true
          export_debug: false
          verbose: true

      - name: 打包游戏
        run: |
          cd build
          zip -r ../Vector-Combat-Windows.zip .

      - name: 创建 GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          name: Vector Combat ${{ github.ref_name }}
          tag_name: ${{ github.ref_name }}
          body: |
            ## Vector Combat ${{ github.ref_name }}

            自动构建版本

            Commit:
            ${{ github.sha }}
          files: Vector-Combat-Windows.zip
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}